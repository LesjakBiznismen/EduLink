name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edulink
          POSTGRES_USER: edulink
          POSTGRES_PASSWORD: edulink
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U edulink -d edulink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://edulink:edulink@localhost:5433/edulink
      JWT_SECRET: ci-testna-skrivnost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edulink-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edulink-vite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
