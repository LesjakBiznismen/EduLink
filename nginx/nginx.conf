# Postreže zgrajeno React aplikacijo in posreduje /api zahteve backendu.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gradiva in oddaje so lahko velike do 20 MB (+ režija multipart).
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Zgrajene datoteke imajo hash v imenu, zato jih lahko brskalnik dolgo hrani.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # BrowserRouter: vse ostale poti vrnejo index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
